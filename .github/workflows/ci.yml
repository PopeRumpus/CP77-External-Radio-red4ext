name: Build

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point bindgen at the runner's LLVM
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Stage mod folder layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging/red4ext/plugins/CP77-External-Radio, staging/r6/scripts/CP77-External-Radio, staging/r6/tweaks | Out-Null
          Copy-Item target/release/cp77_external_radio.dll staging/red4ext/plugins/CP77-External-Radio/
          Copy-Item reds/* staging/r6/scripts/CP77-External-Radio/
          Copy-Item tweaks/* staging/r6/tweaks/

      - uses: actions/upload-artifact@v4
        with:
          name: CP77-External-Radio-2.5
          path: staging/
